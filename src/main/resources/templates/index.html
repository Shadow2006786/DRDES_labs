<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Middleware Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2>1. Облікові дані</h2>
    <table class="table">
        <tr><th>User</th><th>Status</th></tr>
        <tr th:each="u : ${users}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.status}"></td>
        </tr>
    </table>

    <hr>

    <h2>2. Бібліотечний каталог</h2>
    <table class="table">
        <tr><th>Назва</th><th>Категорія</th><th>Статус</th></tr>
        <tr th:each="b : ${books}">
            <td th:text="${b.title}"></td>
            <td th:text="${b.category}"></td>
            <td th:text="${b.status}"></td>
        </tr>
    </table>

    <hr>

    <h2>5. Студенти групи</h2>
    <table class="table">
        <tr><th>ПІБ</th><th>Квиток</th><th>Курс</th></tr>
        <tr th:each="s : ${students}">
            <td th:text="${s.fullName}"></td>
            <td th:text="${s.studentId}"></td>
            <td th:text="${s.course}"></td>
        </tr>
    </table>

</body>
</html>
